# IM series definition catalog (induction motors only)
#
# NOTE:
# - This file is the reference source for series definitions.
# - Estimation bounds/init live in bounds_and_init/im_descriptor_bounds_and_init.yaml.
# - Physical quantities use SI base units (or post to_base_unit() contract units).
# - See cable_series_catalog.yaml for cable definitions.
# - Double-cage entries use cage_multiplicity: DOUBLE_CAGE with secondary_inner /
#   secondary_outer.
# - friction_windage / stray_load are required on every entry. Zero loss is the
#   explicit model type NONE, not an omitted key.

version: 1

im_series:
  # Single-cage (CatalogImSeriesNameV1). Small motors for verification.

  # Basic01: STAR, L-type. Primary, excitation, and secondary are all BASIC.
  - name: "Basic01"
    poles: 4
    nameplate:
      voltage: { value: 200.0, unit: "V" }
      current: { value: 13.86, unit: "A" }
      power: { value: 3711.0, unit: "W" }
      frequency: { value: 50.0, unit: "Hz" }
    connection_type: "STAR"
    circuit_type: "L"
    primary:
      model: { name: "BASIC", params: [] }
      resistance: { value: 0.4, unit: "Ω" }
      inductance: { value: 0.001785650652, unit: "H" }
    excitation:
      model: { name: "BASIC", params: [] }
      resistance: { value: 235.2941176, unit: "Ω" }
      inductance: { value: 0.06709536625, unit: "H" }
    secondary:
      model: { name: "BASIC", params: [] }
      resistance: { value: 0.3398, unit: "Ω" }
      inductance: { value: 0.001785650652, unit: "H" }
    friction_windage:
      model: { name: "NONE", params: [] }
    stray_load:
