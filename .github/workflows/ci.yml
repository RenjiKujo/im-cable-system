name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一ブランチで新しい push が来たら古い実行をキャンセル
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg  # matplotlib をヘッドレスで動かす

# 各ジョブの python-version: "3.12" は .python-version(3.12.11)と値が一致しているだけで、
# このワークフローは .python-version を自動参照していない(直書き)。
# 変更時は .python-version 側も手動で合わせる。
jobs:
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[dev,web]" --system
      - name: Ruff format check
        run: ruff format --check src tests apps
      - name: Ruff lint
        run: ruff check src tests apps

  typecheck:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[dev,web]" --system
      - name: Pyright
        run: basedpyright

  test:
    name: Tests (pytest, not slow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[dev,web]" --system
      # docs↔実装の整合性テスト（tests/test_docs/）もこの pytest に含まれる。
      # 専用ジョブは置かず、CI で確認するテストは tests/ に一本化する。
      - name: Pytest (not slow)
        run: pytest -m "not slow" -q
